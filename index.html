<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบแจ้งสิ่งของชำรุด — โรงเรียนดอนศาลานำวิทยา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700;800&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="badge-icon">ดศ</div>
    <div class="hero-text">
      <span class="hero-eyebrow">โรงเรียนดอนศาลานำวิทยา</span>
      <h1>ระบบแจ้งสิ่งของชำรุด</h1>
      <p>แจ้งได้ไว รูปชัดเจน ถึงมือผู้รับผิดชอบทันที</p>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs">
    <button id="tab-report" class="active">📋 แจ้งซ่อม</button>
    <button id="tab-admin">🛠️ ผู้รับผิดชอบ <span id="pendingDot" class="pending-dot" style="display:none">0</span></button>
  </nav>

  <div id="view-report"></div>
  <div id="view-admin" style="display:none"></div>

  <p class="notice">ข้อมูลรายการแจ้งซ่อมทั้งหมดบันทึกลง Google Sheet ส่วนกลาง เจ้าหน้าที่ทุกคนที่เปิดหน้านี้จะเห็นรายการเดียวกัน และฝ่ายที่รับผิดชอบจะได้รับอีเมลแจ้งเตือนทันทีที่มีการแจ้งซ่อมใหม่</p>
</div>

<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
